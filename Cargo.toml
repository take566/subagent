[package]
name = "subagent"
version = "1.1.0"
edition = "2024"
rust-version = "1.89"
description = "Subagent system for task delegation and parallel processing"
license = "MIT"
keywords = ["agent", "subagent", "orchestration", "mcp"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "research-server"
path = "src/bin/research-server.rs"

[[bin]]
name = "codegen-server"
path = "src/bin/codegen-server.rs"

[[bin]]
name = "review-server"
path = "src/bin/review-server.rs"

[[bin]]
name = "document-server"
path = "src/bin/document-server.rs"

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
futures = "0.3.34"
rand = "0.10.4"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rmcp = { version = "3.12.0", features = ["server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
